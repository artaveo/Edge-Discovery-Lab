; Edge Discovery Lab - Step B: start EL_ExportM1 when the terminal starts.
; Copy this file into the MT5 data folder's config\ directory, then run
;   terminal64.exe /config:"%APPDATA%\MetaQuotes\Terminal\D0E8209F77C8CF37AD8BF550E51FF075\config\el_export.ini"
; The script's defaults are XAUUSD, 2020..2022 (2020 starts 2020-07-01), output MQL5\Files\EdgeLab\data.
; It refuses any year outside 2020..2022 and any bar before 2020-07-01 (F1 data discipline).
[StartUp]
Script=EdgeLab\EL_ExportM1
Symbol=XAUUSD
Period=M1
ShutdownTerminal=0
