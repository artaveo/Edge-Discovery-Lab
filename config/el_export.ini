; Edge Discovery Lab - F6 Step B: start EL_ExportM1 when the terminal starts.
; Copy this file into the MT5 data folder's config\ directory, then run
;   terminal64.exe /config:"%APPDATA%\MetaQuotes\Terminal\D0E8209F77C8CF37AD8BF550E51FF075\config\el_export.ini"
; The script's defaults are NDX100, 2020..2022 (from 2020-07-01), output MQL5\Files\EdgeLab\data\f6.
; Set Symbol below to the Nasdaq-100 CFD name shown in Market Watch (e.g. NDX100 / US100).
; It refuses any year outside 2020..2022, never writes a bar dated 2023-01-01 or later and refuses XAUUSD
; (F6 data discipline). The F1 (2020-07-01..2022) and F2 (2023..2024) XAUUSD exports are done.
[StartUp]
Script=EdgeLab\EL_ExportM1
Symbol=NDX100
Period=M1
ShutdownTerminal=0
