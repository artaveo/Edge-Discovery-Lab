; Edge Discovery Lab - F2 Step B: start EL_ExportM1 when the terminal starts.
; Copy this file into the MT5 data folder's config\ directory, then run
;   terminal64.exe /config:"%APPDATA%\MetaQuotes\Terminal\D0E8209F77C8CF37AD8BF550E51FF075\config\el_export.ini"
; The script's defaults are XAUUSD, 2023..2024, output MQL5\Files\EdgeLab\data\f2.
; It refuses any year outside 2023..2024 and never writes a bar dated 2025-01-01 or later (F2 data discipline;
; 2025 is the locked final test). The F1 export (2020-07-01..2022) is done.
[StartUp]
Script=EdgeLab\EL_ExportM1
Symbol=XAUUSD
Period=M1
ShutdownTerminal=0
